name: CI

on:
  push:
    branches: [dev, master, staging]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 56 pre-existing typecheck errors exist across the workspace (recorded
      # in docs/CODEBASE_ANALYSIS.md). Non-blocking until that backlog is
      # burned down — flip this to blocking as soon as it reaches zero.
      - run: pnpm run typecheck
        continue-on-error: true
      - run: pnpm run test
